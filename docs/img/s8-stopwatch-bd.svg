<svg viewBox="-111 18 777 386" width="777" role="img"><path d="M 370 102 L 430 102" fill="none" stroke="#C77A1F" stroke-width="3" stroke-linejoin="round" class="lvd-flow"/><path d="M 195 222 L 430 222" fill="none" stroke="#6B6F2A" stroke-width="4" stroke-linejoin="round"/><rect x="120" y="60" width="250" height="54" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="245.0" y="75" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">High Resolution Relative Seconds</text><text x="245.0" y="87" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">Timing palette — NO input terminals at all</text><rect x="365" y="98" width="10" height="8" fill="#C77A1F"/><text x="362" y="105.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="430" y="70" width="150" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="505.0" y="85" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">seconds</text><rect x="425" y="98" width="10" height="8" fill="#C77A1F"/><text x="438" y="105.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="45" y="190" width="150" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="120.0" y="205" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">error in</text><rect x="190" y="218" width="10" height="8" fill="#6B6F2A"/><text x="187" y="225.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="430" y="190" width="150" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="505.0" y="205" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">error out</text><rect x="425" y="218" width="10" height="8" fill="#6B6F2A"/><text x="438" y="225.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><text x="45" y="292" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">Look at the left edge of the timing node: there is nothing there. It takes no inputs, so</text><text x="45" y="308" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">LabVIEW has no data reason to run it early or late — dataflow alone cannot order it.</text><text x="45" y="330" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#2F5DE0">That is what the error wire underneath is for. Wiring error in → error out through the VI</text><text x="45" y="346" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#2F5DE0">is what pins this VI into the caller’s execution order. Without it, timing is meaningless.</text><text x="45" y="368" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" fill="#59647A">Thick dashed border = control terminal (a source). Thin border = indicator terminal (a sink).</text><text x="275" y="132" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">no terminals on this edge →</text></svg>