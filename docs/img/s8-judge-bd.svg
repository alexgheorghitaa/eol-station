le="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="165" y="30" width="185" height="108" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="257.5" y="45" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">In Range and Coerce</text><rect x="160" y="56.0" width="10" height="8" fill="#C77A1F"/><text x="173" y="63.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x</text><rect x="160" y="73.75" width="10" height="8" fill="#C77A1F"/><text x="173" y="81.25" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">upper limit</text><rect x="160" y="91.5" width="10" height="8" fill="#C77A1F"/><text x="173" y="99.0" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">lower limit</text><rect x="160" y="109.25" width="10" height="8" fill="#3F9C4E"/><text x="173" y="116.75" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">include upper limit?</text><rect x="160" y="127.0" width="10" height="8" fill="#3F9C4E"/><text x="173" y="134.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">include lower limit?</text><rect x="345" y="56.0" width="10" height="8" fill="#3F9C4E"/><text x="342" y="63.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">In Range?</text><rect x="345" y="127.0" width="10" height="8" fill="#C77A1F"/><text x="342" y="134.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">coerced(x)</text><rect x="395" y="40" width="155" height="44" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="472.5" y="55" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">And Array Elements</text><rect x="390" y="68" width="10" height="8" fill="#3F9C4E"/><text x="403" y="75.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">Boolean array</text><rect x="545" y="68" width="10" height="8" fill="#3F9C4E"/><text x="542" y="75.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">And</text><rect x="165" y="300" width="185" height="92" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="257.5" y="315" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">Array Max &amp; Min</text><rect x="160" y="328" width="10" height="8" fill="#C77A1F"/><text x="173" y="335.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">array</text><rect x="345" y="326.0" width="10" height="8" fill="#C77A1F"/><text x="342" y="333.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">max value</text><rect x="345" y="344.3333333333333" width="10" height="8" fill="#3D6FE0"/><text x="342" y="351.8333333333333" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">max index</text><rect x="345" y="362.6666666666667" width="10" height="8" fill="#C77A1F"/><text x="342" y="370.1666666666667" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">min value</text><rect x="345" y="381.0" width="10" height="8" fill="#3D6FE0"/><text x="342" y="388.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">min index</text><rect x="395" y="318" width="120" height="60" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="455.0" y="333" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">Subtract</text><rect x="390" y="344.0" width="10" height="8" fill="#C77A1F"/><text x="403" y="351.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x</text><rect x="390" y="367.0" width="10" height="8" fill="#C77A1F"/><text x="403" y="374.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">y</text><rect x="510" y="346" width="10" height="8" fill="#C77A1F"/><text x="507" y="353.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x-y</text><rect x="580" y="210" width="135" height="60" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="647.5" y="225" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">Less Or Equal?</text><rect x="575" y="236.0" width="10" height="8" fill="#C77A1F"/><text x="588" y="243.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x</text><rect x="575" y="259.0" width="10" height="8" fill="#C77A1F"/><text x="588" y="266.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">y</text><rect x="710" y="238" width="10" height="8" fill="#3F9C4E"/><text x="707" y="245.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x&lt;=y?</text><rect x="785" y="150" width="120" height="60" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="845.0" y="165" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">And</text><rect x="780" y="176.0" width="10" height="8" fill="#3F9C4E"/><text x="793" y="183.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x</text><rect x="780" y="199.0" width="10" height="8" fill="#3F9C4E"/><text x="793" y="206.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">y</text><rect x="900" y="178" width="10" height="8" fill="#3F9C4E"/><text x="897" y="185.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x.and.y</text><rect x="950" y="140" width="100" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="1000.0" y="155" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">pass?</text><rect x="945" y="168" width="10" height="8" fill="#3F9C4E"/><text x="958" y="175.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="600" y="400" width="120" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="660.0" y="415" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">deltaV</text><rect x="595" y="428" width="10" height="8" fill="#C77A1F"/><text x="608" y="435.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="600" y="470" width="140" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="670.0" y="485" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">worst cell V</text><rect x="595" y="498" width="10" height="8" fill="#C77A1F"/><text x="608" y="505.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="600" y="540" width="120" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="660.0" y="555" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">worst cell</text><rect x="595" y="568" width="10" height="8" fill="#3D6FE0"/><text x="608" y="575.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><text x="25" y="625" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#2F5DE0">max value / max index / min value / min index — top to bottom. Getting these two mixed up is</text><text x="25" y="641" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#2F5DE0">the classic bug: min INDEX is which cell (blue I32), min VALUE is its voltage (orange DBL).</text><text x="25" y="663" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">volts leaves ONE terminal square and feeds TWO nodes. That is a branch, not a second wire —</text><text x="25" y="679" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">the trunk is shared until it splits. Branching a data wire is always legal.</text><text x="25" y="701" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">include upper limit? / include lower limit? on In Range and Coerce, and coerced(x), stay</text><text x="25" y="717" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">UNWIRED — their defaults (both TRUE) are what you want. Leaving an input unwired is normal.</text><text x="350" y="292" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">one square, two wires → branch</text></svg>