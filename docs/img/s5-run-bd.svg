-size="11.5" font-weight="600" fill="#1B2130">TCP Open Connection</text><rect x="245" y="66.0" width="10" height="8" fill="#BB4FB0"/><text x="258" y="73.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">address</text><rect x="245" y="84.33333333333333" width="10" height="8" fill="#3D6FE0"/><text x="258" y="91.83333333333333" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">remote port</text><rect x="245" y="102.66666666666666" width="10" height="8" fill="#3D6FE0"/><text x="258" y="110.16666666666666" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">timeout ms</text><rect x="245" y="121.0" width="10" height="8" fill="#6B6F2A"/><text x="258" y="128.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error in</text><rect x="440" y="66.0" width="10" height="8" fill="#6B7A8F"/><text x="437" y="73.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">connection ID</text><rect x="440" y="121.0" width="10" height="8" fill="#6B6F2A"/><text x="437" y="128.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error out</text><rect x="520" y="40" width="185" height="92" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="612.5" y="55" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">Sequencer.vi</text><rect x="515" y="66.0" width="10" height="8" fill="#6B7A8F"/><text x="528" y="73.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">connection ID</text><rect x="515" y="84.33333333333333" width="10" height="8" fill="#3D6FE0"/><text x="528" y="91.83333333333333" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">seed</text><rect x="515" y="102.66666666666666" width="10" height="8" fill="#3F9C4E"/><text x="528" y="110.16666666666666" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">golden?</text><rect x="515" y="121.0" width="10" height="8" fill="#6B6F2A"/><text x="528" y="128.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error in</text><rect x="700" y="66.0" width="10" height="8" fill="#6B7A8F"/><text x="697" y="73.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">connection ID out</text><rect x="700" y="93.5" width="10" height="8" fill="#6B6F2A"/><text x="697" y="101.0" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">TestData</text><rect x="700" y="121.0" width="10" height="8" fill="#6B6F2A"/><text x="697" y="128.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error out</text><rect x="520" y="300" width="185" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="612.5" y="315" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">TestData</text><rect x="515" y="328" width="10" height="8" fill="#6B6F2A"/><text x="528" y="335.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="790" y="40" width="200" height="60" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="890.0" y="55" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">TCP Close Connection</text><rect x="785" y="66.0" width="10" height="8" fill="#6B7A8F"/><text x="798" y="73.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">connection ID</text><rect x="785" y="89.0" width="10" height="8" fill="#6B6F2A"/><text x="798" y="96.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error in</text><rect x="985" y="68" width="10" height="8" fill="#6B6F2A"/><text x="982" y="75.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error out</text><rect x="790" y="200" width="200" height="44" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="890.0" y="215" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">Simple Error Handler.vi</text><rect x="785" y="228" width="10" height="8" fill="#6B6F2A"/><text x="798" y="235.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error in</text><text x="160" y="470" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#B4413C" font-weight="600">Never wire the phantom dashed wire. Two branches from one source have no order between them —</text><text x="160" y="486" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">LabVIEW is free to close the connection before the sequence runs, and you get error 1 with no clue why.</text><text x="160" y="508" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#2F5DE0" font-weight="600">Refnum along the top, error along the bottom. Those two chains ARE the execution order — there is no</text><text x="160" y="524" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">other rule. Sequencer.vi passes the refnum straight through precisely so it can sit in the chain.</text><text x="160" y="546" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">TCP Open Connection ▸ timeout ms is left unwired here: the default is 60000 ms.</text><text x="160" y="568" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9.5" fill="#59647A">legend: grey = TCP refnum, olive/thick = cluster (error, limits, Result, TestData), blue = enum + I32, orange = DBL, pink = string, green = boolean</text><path d="M 445 70 C 560 -30 700 -30 790 70" fill="none" stroke="#B4413C" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M 590 -14 L 650 30 M 650 -14 L 590 30" stroke="#B4413C" stroke-width="5" stroke-linecap="round"/><text x="620" y="-26" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#B4413C">NEVER this direct branch</text><path d="M 250 435 L 990 435" fill="none" stroke="#177E4D" stroke-width="3"/><path d="M 250 435 L 250 425 M 990 435 L 990 425" stroke="#177E4D" stroke-width="3"/><text x="620" y="452" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#177E4D">refnum along the top · error along the bottom</text></svg>