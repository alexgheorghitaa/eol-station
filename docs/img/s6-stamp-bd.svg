eight="600" fill="#1B2130">error in</text><text x="135.0" y="307" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">control terminal</text><rect x="205" y="318" width="10" height="8" fill="#6B6F2A"/><text x="202" y="325.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error in</text><rect x="430" y="60" width="150" height="54" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="505.0" y="75" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">ms</text><text x="505.0" y="87" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">indicator terminal</text><rect x="425" y="98" width="10" height="8" fill="#3D6FE0"/><text x="438" y="105.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">ms</text><rect x="430" y="160" width="150" height="54" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="505.0" y="175" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">time</text><text x="505.0" y="187" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">indicator terminal</text><rect x="425" y="198" width="10" height="8" fill="#C77A1F"/><text x="438" y="205.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">time</text><rect x="430" y="280" width="150" height="54" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="505.0" y="295" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">error out</text><text x="505.0" y="307" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">indicator terminal</text><rect x="425" y="318" width="10" height="8" fill="#6B6F2A"/><text x="438" y="325.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error out</text><text x="60" y="380" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">The error wire IS the whole VI. Tick Count and Get Date/Time have no error</text><text x="60" y="396" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">terminals, so nothing sequences them; the error wire threaded through Stamp.vi</text><text x="60" y="412" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">is what lets a caller pin the tick to an exact point in a sequence.</text><text x="60" y="436" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#2F5DE0">Both nodes read the clock the instant the VI runs - there is no input to wire.</text></svg>