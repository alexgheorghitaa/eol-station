<svg viewBox="-26 18 702 374" width="702" role="img"><path d="M 390 102 L 430.0 102 L 430.0 96 L 470 96" fill="none" stroke="#C77A1F" stroke-width="3" stroke-linejoin="round" class="lvd-flow"/><text x="430" y="88" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">W1  DBL</text><path d="M 175 232 L 470 232" fill="none" stroke="#6B6F2A" stroke-width="4" stroke-linejoin="round"/><text x="322" y="224" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">W2  error cluster - passes straight through, touches nothing</text><rect x="140" y="60" width="250" height="54" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="265.0" y="75" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">High Resolution Relative Seconds</text><text x="265.0" y="87" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">built-in VI - no input terminals</text><rect x="385" y="98" width="10" height="8" fill="#C77A1F"/><text x="382" y="105.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="470" y="64" width="120" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="530.0" y="79" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">seconds</text><rect x="465" y="92" width="10" height="8" fill="#C77A1F"/><text x="478" y="99.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="60" y="200" width="115" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="117.5" y="215" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">error in</text><rect x="170" y="228" width="10" height="8" fill="#6B6F2A"/><text x="167" y="235.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="470" y="200" width="120" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="530.0" y="215" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">error out</text><rect x="465" y="228" width="10" height="8" fill="#6B6F2A"/><text x="478" y="235.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><text x="180" y="292" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#1B2130">The two wires NEVER touch. There is no data path from error in to the seconds output.</text><text x="180" y="312" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">The error wire only passes through - and that is the whole point: it gives Tick.vi a place</text><text x="180" y="332" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">in the caller's dataflow order, so the caller can pin the timestamp to an exact moment.</text><text x="180" y="356" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" fill="#59647A">Thick border = control (error in).   Thin border = indicator (seconds, error out).</text><text x="265" y="52" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">no inputs on the left edge at all</text></svg>