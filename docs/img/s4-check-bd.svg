Coerce takes upper limit FIRST and lower limit THIRD. Wire them the wrong way round and every step reports Pass.</text><text x="140" y="470" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">margin = the SMALLER of (value - low) and (high - value). It goes negative exactly when the step fails, so it is the number worth logging.</text><text x="140" y="488" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">coerced(x) and the Max &amp; Min larger output stay unwired — that is correct, not a mistake. This VI has no error terminals at all.</text></svg>