<text x="932.5" y="305" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">Fract/Exp String To Number</text><rect x="835" y="316.0" width="10" height="8" fill="#BB4FB0"/><text x="848" y="323.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">string</text><rect x="835" y="335.5" width="10" height="8" fill="#3D6FE0"/><text x="848" y="343.0" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">offset</text><rect x="835" y="355.0" width="10" height="8" fill="#C77A1F"/><text x="848" y="362.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">default</text><rect x="1020" y="316.0" width="10" height="8" fill="#3D6FE0"/><text x="1017" y="323.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">offset past number</text><rect x="1020" y="355.0" width="10" height="8" fill="#C77A1F"/><text x="1017" y="362.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">number</text><rect x="1060" y="187" width="95" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="1107.5" y="202" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">low</text><rect x="1055" y="215" width="10" height="8" fill="#C77A1F"/><text x="1068" y="222.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="1060" y="327" width="95" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="1107.5" y="342" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">high</text><rect x="1055" y="355" width="10" height="8" fill="#C77A1F"/><text x="1068" y="362.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><text x="140" y="465" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">Index Array with index (row) left EMPTY and index (col) wired to 0 hands back the whole first column — the list of step names — in one node.</text><text x="140" y="483" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">Search 1D Array returns -1 when the name is not in the file. Greater Or Equal To 0? turns that into found?, so a typo in limits.csv shows as a dark LED instead of a crash.</text><text x="140" y="501" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">The second and third Index Array read columns 1 and 2 of the SAME row index, so low and high can never come from two different lines.</text></svg>