<svg viewBox="-116 -2 972 496" width="880" role="img"><path d="M 305 82 L 352.5 82 L 352.5 85.0 L 400 85.0" fill="none" stroke="#C77A1F" stroke-width="3" stroke-linejoin="round" class="lvd-flow"/><path d="M 135 197 L 267.5 197 L 267.5 108.0 L 400 108.0" fill="none" stroke="#C77A1F" stroke-width="3" stroke-linejoin="round"/><path d="M 540 87 L 585.0 87 L 585.0 94 L 630 94" fill="none" stroke="#C77A1F" stroke-width="3" stroke-linejoin="round"/><path d="M 180 312 L 630 312" fill="none" stroke="#6B6F2A" stroke-width="4" stroke-linejoin="round"/><rect x="40" y="40" width="265" height="54" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="172.5" y="55" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">High Resolution Relative Seconds</text><text x="172.5" y="67" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">no left terminals at all</text><rect x="300" y="78" width="10" height="8" fill="#C77A1F"/><text x="297" y="85.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">seconds</text><rect x="40" y="155" width="95" height="54" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="87.5" y="170" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">1000</text><text x="87.5" y="182" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">DBL constant</text><rect x="130" y="193" width="10" height="8" fill="#C77A1F"/><text x="127" y="200.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="400" y="55" width="140" height="60" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="470.0" y="70" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">Multiply</text><rect x="395" y="81.0" width="10" height="8" fill="#C77A1F"/><text x="408" y="88.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x</text><rect x="395" y="104.0" width="10" height="8" fill="#C77A1F"/><text x="408" y="111.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">y</text><rect x="535" y="83" width="10" height="8" fill="#C77A1F"/><text x="532" y="90.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">x*y</text><rect x="630" y="62" width="140" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="700.0" y="77" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">ms</text><rect x="625" y="90" width="10" height="8" fill="#C77A1F"/><text x="638" y="97.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="40" y="280" width="140" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="110.0" y="295" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">error in</text><rect x="175" y="308" width="10" height="8" fill="#6B6F2A"/><text x="172" y="315.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="630" y="280" width="140" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="700.0" y="295" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">error out</text><rect x="625" y="308" width="10" height="8" fill="#6B6F2A"/><text x="638" y="315.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><text x="40" y="370" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" fill="#2F5DE0" font-weight="600">This wire is the entire point of the VI.</text><text x="40" y="390" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">High Resolution Relative Seconds has NO inputs, so nothing can force it to run at a particular moment —</text><text x="40" y="406" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">on a bare diagram LabVIEW may execute it first, last, or anywhere between. That is the problem.</text><text x="40" y="426" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">Wrapping it in a SubVI whose error in and error out are wired into the caller’s chain fixes it: a SubVI cannot</text><text x="40" y="442" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">start until its error in arrives and nothing downstream starts until it finishes — so the clock read is pinned</text><text x="40" y="458" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">to an exact point in the caller’s sequence, with no Sequence Structure anywhere.</text><text x="40" y="120" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9.5" fill="#B4413C">◀ no inputs — this is the problem</text><path d="M 300 258 L 300 288" stroke="#2F5DE0" stroke-width="2.5" marker-end="none"/><path d="M 295 280 L 300 290 L 305 280 z" fill="#2F5DE0"/><text x="300" y="250" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#2F5DE0">error in → error out, straight through</text></svg>