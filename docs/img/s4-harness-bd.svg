tyle="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">connection ID</text><rect x="955" y="74.0" width="10" height="8" fill="#6B6F2A"/><text x="968" y="81.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error in</text><rect x="1150" y="51.0" width="10" height="8" fill="#6B7A8F"/><text x="1147" y="58.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">connection ID out</text><rect x="1150" y="74.0" width="10" height="8" fill="#6B6F2A"/><text x="1147" y="81.5" text-anchor="end" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error out</text><rect x="1000" y="200" width="210" height="44" rx="4" fill="#ECEEF3" stroke="#C7CDD8" stroke-width="2"/><text x="1105.0" y="215" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">Simple Error Handler.vi</text><rect x="995" y="228" width="10" height="8" fill="#6B6F2A"/><text x="1008" y="235.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">error in</text><rect x="740" y="290" width="145" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="812.5" y="305" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">limits ok?</text><rect x="735" y="318" width="10" height="8" fill="#3F9C4E"/><text x="748" y="325.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><rect x="1010" y="290" width="145" height="44" rx="4" fill="#FFFFFF" stroke="#C7CDD8" stroke-width="2" stroke-dasharray="5 3"/><text x="1082.5" y="305" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1B2130">results</text><rect x="1005" y="318" width="10" height="8" fill="#6B6F2A"/><text x="1018" y="325.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A"></text><text x="0" y="470" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">Two unbroken chains and nothing else: the refnum runs along the top through every VI, the error cluster along the bottom. That is what forces the order of execution.</text><text x="0" y="488" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">To test a different VI you replace ONE node. Test_CellOCV.vi and Test_Contactor.vi have the same terminals in the same places, so the wires survive the swap.</text><text x="0" y="506" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">TCP Open has no error in wired and that is fine — it is first. TCP Close must never be fed from a branch; it has to sit at the end of the chain.</text><path d="M 402 62 L 402 390 L 952 390 L 952 68" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M 952 55 l -6 13 l 12 0 z" fill="#C0392B"/><path d="M 663 378 L 687 402 M 687 378 L 663 402" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="675" y="424" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" fill="#C0392B">branching here closes the connection before the test - error 1</text></svg>