ror</text><rect x="655" y="253" width="10" height="8" fill="#3D6FE0"/><text x="668" y="260.5" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#59647A">3 items</text><text x="40" y="395" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#2F5DE0" font-weight="600">One file per type. Change a field here and every diagram in the project updates.</text><text x="40" y="415" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">Save each .ctl with the Control Editor ring set to Type Def. — as plain "Control" the copies do NOT track.</text><text x="40" y="433" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">An enum wire is an integer wire (blue). A cluster wire is drawn thick olive here, like the error cluster — because</text><text x="40" y="449" text-anchor="start" style="font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#59647A">the error cluster IS just a cluster. Grey = TCP refnum.</text><circle cx="235" cy="108" r="4" fill="#6B6F2A"/></svg>